name: Node.js CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '15.x'
      - name: Install dependencies
        run: |
          cd codebase/rdicidr-0.1.0
          npm install
      - name: Run Lint
        run: |
          cd codebase/rdicidr-0.1.0
          npm run lint
      - name: Run prettier
        run: |
          cd codebase/rdicidr-0.1.0
          npm run prettier -- --write
      - name: Testing
        run: |
          cd codebase/rdicidr-0.1.0
          CI=true npm run test
      - name: Build
        run: |
          cd codebase/rdicidr-0.1.0
          npm run build

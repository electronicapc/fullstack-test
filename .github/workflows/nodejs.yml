name: Node.js CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Git Chekchout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install Dependencies
        run: npm install
      - name: Linter (ESLint)
        run: npm run lint
      - name: Formatter (Prettier)
        run: npm run prettier ––write
      - name: Test (Jest)
        run: CI=true npm run test
      - name: Build
        run: npm run build

name: Node.js CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Git Chekchout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '15.x'
      - name: Install Dependencies
        run: | 
          cd codebase/rdicidr-0.1.0 
          npm install
      - name: Linter (ESLint)
        run: |
          cd codebase/rdicidr-0.1.0
          npm run lint
      - name: Formatter (Prettier)
        run: |
          cd codebase/rdicidr-0.1.0
          npm run prettier -- --write
      - name: Test (Jest)
        run: |
          cd codebase/rdicidr-0.1.0
          CI=true npm run test
      - name: Build
        run: |
          cd codebase/rdicidr-0.1.0
          npm run build
